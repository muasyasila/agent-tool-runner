services:
  - type: web
    name: agent-tool-runner-api
    runtime: python
    repo: https://https://github.com/muasyasila/agent-tool-runner
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false